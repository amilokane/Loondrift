# Egern · routing_v1.0.5 · Meta 与 IP Location
# 在 Egern 中添加自己的订阅，默认归入 Airport。
# 基于 RiverFlowsInUUU/self-conf 的 clash/profiles/routing.min.yaml，许可见文件末尾。
ipv6: false
vif_only: true
# 苹果天气模块使用 ASN 规则。
asn_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb
hijack_dns:
  - '*'
real_ip_domains:
  - '*.lan'
  - '*.local'
  - '*.localdomain'
  - '*.home.arpa'
  - msftconnecttest.com
  - '*.msftconnecttest.com'
  - msftncsi.com
  - '*.msftncsi.com'
  - localhost.ptlogin2.qq.com
  - srv.nintendo.net
  - '*.srv.nintendo.net'
  - stun.playstation.net
  - '*.stun.playstation.net'
  - xboxlive.com
  - '*.xboxlive.com'
  - stun.*
  - time.*.com
  - ntp.*.com
  - pool.ntp.org
  - '*.pool.ntp.org'
  - market.xiaomi.com
  - '*.market.xiaomi.com'
proxy_latency_test_url: https://www.gstatic.com/generate_204
default_subscription_group: Airport
default_proxy_group: Manual

dns:
  bootstrap:
    - 223.5.5.5
    - 119.29.29.29
  upstreams:
    Domestic-DoH:
      - https://doh.18bit.cn/dns-query
      - https://dns.alidns.com/dns-query
    Public-DoH:
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
  forward:
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/RiverFlowsInUUU/RFU-Rules/main/surge-ads.list
        value: reject
        update_interval: 86400
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/private.list
        value: Domestic-DoH
        update_interval: 86400
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/cn.list
        value: Domestic-DoH
        update_interval: 86400
    - domain_wildcard:
        match: '*'
        value: Public-DoH
  proxy_nameservers:
    - https://doh.18bit.cn/dns-query
    - https://dns.alidns.com/dns-query

policy_groups:
  - select:
      name: Proxy
      policies:
        - Smart
        - Hong Kong
        - Taiwan
        - Japan
        - Singapore
        - United States
        - Other Regions
      icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/Proxy.png
  - fallback:
      name: Smart
      policies:
        - Low Mult.
        - Auto
        - High Mult.
      interval: 300
      icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/Auto.png
  - auto_test:
      name: Low Mult.
      policies:
        - Manual
      flatten: true
      filter: ^(?!.*(?:剩余|流量|到期|过期|官网|订阅|重置|续费|Traffic|Expire|GB))(?=.*(?:^|[^\d.])(0\.\d*[1-9]))((?!直连|DIRECT).)*$
      interval: 300
      tolerance: 50
      hidden: true
  - auto_test:
      name: Auto
      policies:
        - Manual
      flatten: true
      filter: ^(?!.*(?:剩余|流量|到期|过期|官网|订阅|重置|续费|Traffic|Expire|GB))(?!.*(?:^|[^\d.])(0\.\d*[1-9]))(?!.*(?:^|[^\d.])([1-9]\d*(?:\.\d+)?\s*(?:倍率|倍|x|X|\*)))((?!直连|DIRECT).)*$
      interval: 300
      tolerance: 50
      hidden: true
  - auto_test:
      name: High Mult.
      policies:
        - Manual
      flatten: true
      filter: ^(?!.*(?:剩余|流量|到期|过期|官网|订阅|重置|续费|Traffic|Expire|GB))(?=.*(?:^|[^\d.])([1-9]\d*(?:\.\d+)?\s*(?:倍率|倍|x|X|\*)))((?!直连|DIRECT).)*$
      interval: 300
      tolerance: 50
      hidden: true
  - select:
      name: ChatGPT
      policies:
        - United States
        - Taiwan
        - Japan
        - Singapore
      icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/openai.png
  - select:
      name: Gemini
      policies:
        - United States
        - Taiwan
        - Japan
        - Singapore
      icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/gemini-color.png
  - select:
      name: Claude
      policies:
        - Taiwan
        - Japan
        - Singapore
        - United States
      icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/claude-color.png
  - select:
      name: AI
      policies:
        - Smart
        - Taiwan
        - Japan
        - Singapore
        - United States
      icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/grok.png
  - select:
      name: YouTube
      policies:
        - Smart
        - Hong Kong
        - Taiwan
        - Japan
        - Singapore
        - United States
      icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/YouTube.png
  - select:
      name: Google
      policies:
        - Gemini
        - Smart
        - Hong Kong
        - Taiwan
        - Japan
        - Singapore
        - United States
      icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/Google.png
  - select:
      name: Telegram
      policies:
        - Smart
        - Hong Kong
        - Taiwan
        - Japan
        - Singapore
        - United States
      icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/Telegram.png
  - select:
      name: Meta
      policies:
        - Smart
        - Hong Kong
        - Taiwan
        - Japan
        - Singapore
        - United States
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Meta.png
  - select:
      name: Spotify
      policies:
        - United States
        - Hong Kong
        - Taiwan
        - Japan
        - Singapore
      icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/Spotify.png
  - select:
      name: Twitter
      policies:
        - Smart
        - Hong Kong
        - Taiwan
        - Japan
        - Singapore
        - United States
      icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/Twitter.png
  - select:
      name: IP Location
      policies:
        - Proxy
        - Manual
        - Hong Kong
        - Japan
        - United States
        - Singapore
        - Taiwan
        - Other Regions
        - DIRECT
      icon: mappin.circle.fill
  - select:
      name: Manual
      policies:
        - Airport
      flatten: true
      filter: (?i)^(?!.*(?:剩余|到期|过期|有效期|套餐|官网|官方网站|重置|公告|流量\s*(?:[:：]|\d)|\b(?:traffic|remaining\s+(?:traffic|data)|expir(?:e|es|ed|y|ation)|reset)\b|https?://)).+$
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Static.png
  - external:
      name: Airport
      type: auto_test
      urls: []
      update_interval: 86400
      interval: 300
      latency_test_url: https://www.gstatic.com/generate_204
      hidden: true
      icon: tray.and.arrow.down
  - select:
      name: Microsoft
      policies:
        - DIRECT
        - Proxy
      icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/Microsoft.png
  - select:
      name: Apple Update
      policies:
        - DIRECT
        - REJECT
      icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/Apple.png
  - select:
      name: AD
      policies:
        - REJECT
        - DIRECT
      icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/AdBlock.png
  - auto_test:
      name: Hong Kong
      policies:
        - Manual
      flatten: true
      filter: (?i)(?=.*(香港|港|HK|Hong))^((?!(台|日|韩|新|美)).)*$
      interval: 300
      tolerance: 50
      icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/HongKong.png
  - auto_test:
      name: Taiwan
      policies:
        - Manual
      flatten: true
      filter: (?i)(?=.*(台湾|台|TW|Taiwan|Tai|TPE|Taipei))^((?!(港|韩|新|美|日)).)*$
      interval: 300
      tolerance: 50
      icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/Taiwan.png
  - auto_test:
      name: Japan
      policies:
        - Manual
      flatten: true
      filter: (?i)(?=.*(日本|东京|大阪|日|JP|Japan|NRT|HND|KIX|FUK|NGO|OSA|CTS|SDJ|OKA))^((?!(港|台|韩|新|美)).)*$
      interval: 300
      tolerance: 50
      icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/Japan.png
  - auto_test:
      name: Singapore
      policies:
        - Manual
      flatten: true
      filter: (?i)(?=.*(新加坡|坡|狮城|SG|SGP|SIN|Singapore))^((?!(台|日|韩|深|美)).)*$
      interval: 300
      tolerance: 50
      icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/Singapore.png
  - auto_test:
      name: United States
      policies:
        - Manual
      flatten: true
      filter: (?i)(?=.*(美国|美|US|USA|United|States|America|洛杉矶|硅谷|西雅图|芝加哥|达拉斯|凤凰城|阿什本|纽约|迈阿密|波士顿|休斯顿|亚特兰大|拉斯维加斯|圣地亚哥|盐湖城|奥斯汀|波特兰|丹佛|奥克兰|安大略|圣安娜|LAX|SJC|SFO|SEA|ORD|JFK|DFW|IAD|PHX|ATL|BOS|MIA|EWR|LGA|IAH|HOU|DEN|OAK|ONT|SNA|LAS|PDX|DAL|SAN|SLC|MSP))^((?!(港|台|韩|新|日)).)*$
      interval: 300
      tolerance: 50
      icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/UnitedStates.png
  - auto_test:
      name: Other Regions
      policies:
        - Manual
      flatten: true
      filter: (?i)^(?!(.*(香港|港|HK|Hong|台湾|台|TW|Taiwan|Tai|TPE|Taipei|日本|东京|大阪|日|JP|Japan|NRT|HND|KIX|FUK|NGO|OSA|CTS|SDJ|OKA|新加坡|坡|狮城|SG|Singapore|SIN|SGP|美国|美|US|United|States|America|USA|洛杉矶|硅谷|西雅图|芝加哥|达拉斯|凤凰城|阿什本|纽约|迈阿密|波士顿|休斯顿|亚特兰大|拉斯维加斯|圣地亚哥|盐湖城|奥斯汀|波特兰|丹佛|奥克兰|安大略|圣安娜|LAX|SJC|SFO|SEA|ORD|JFK|DFW|IAD|PHX|ATL|BOS|MIA|EWR|LGA|IAH|HOU|DEN|OAK|ONT|SNA|LAS|PDX|DAL|SAN|SLC|MSP)))(?!(.*(剩余|流量|到期|过期|官网|订阅|重置|续费|Traffic|Expire|GB|倍率|测试|有效|禁止|邮箱|客服|地址|网站|群组))).+$
      interval: 300
      tolerance: 50
      icon: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/icons/WorldMap.png

rules:
  # IP 规则先检查现有地址，再查远程网段表，避免为了匹配网段触发域名解析。
  - rule_set:
      name: RFU-Direct
      match: https://raw.githubusercontent.com/RiverFlowsInUUU/RFU-Rules/main/surge-direct.list
      update_interval: 86400
      policy: DIRECT
  - rule_set:
      name: RFU-Ads
      match: https://raw.githubusercontent.com/RiverFlowsInUUU/RFU-Rules/main/surge-ads.list
      update_interval: 86400
      policy: AD
  - rule_set:
      name: apple-update
      match: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/apple-update.list
      update_interval: 86400
      policy: Apple Update
  - rule_set:
      name: apple-system
      match: https://raw.githubusercontent.com/RiverFlowsInUUU/self-conf/main/rules/apple_system.list
      update_interval: 86400
      policy: DIRECT
  - and:
      name: geoip-private
      match:
        - or:
            match:
              - ip_cidr:
                  match: 0.0.0.0/0
                  no_resolve: true
              - ip_cidr6:
                  match: ::/0
                  no_resolve: true
        - rule_set:
            match: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/classical/private.list
            update_interval: 86400
      policy: DIRECT
  - rule_set:
      name: private
      match: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/private.list
      update_interval: 86400
      policy: DIRECT
  - rule_set:
