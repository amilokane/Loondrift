    url: https://egern.pages.dev/modules/fmz200/wool_scripts/Loon/plugin/split/partB/bilibili.yaml
    enabled: true
  - name: 斗鱼直播
    url: https://egern.pages.dev/modules/fmz200/wool_scripts/Loon/plugin/split/partD/DouyuLive.yaml
    enabled: true
  - name: 闲鱼
    url: https://egern.pages.dev/modules/fmz200/wool_scripts/Loon/plugin/split/partX/XianYu.yaml
    enabled: true
  - name: YouTube
    url: https://egern.pages.dev/modules/fmz200/wool_scripts/Loon/plugin/split/partY/YouTube.yaml
    enabled: true
  - name: 淘宝
    url: https://egern.pages.dev/modules/fmz200/wool_scripts/Loon/plugin/split/partT/Taobao.yaml
