  - name: 淘宝
    url: https://egern.pages.dev/modules/fmz200/wool_scripts/Loon/plugin/split/partT/Taobao.yaml
    enabled: false
  - name: 拼多多
    url: https://egern.pages.dev/modules/fmz200/wool_scripts/Loon/plugin/split/partP/Pinduoduo.yaml
    enabled: false
  - name: 网易云音乐
    url: https://egern.pages.dev/modules/fmz200/wool_scripts/Loon/plugin/split/partW/NetEaseCloudMusic.yaml
    enabled: false
  - name: 懂球帝
    url: https://egern.pages.dev/modules/fmz200/wool_scripts/Loon/plugin/split/partD/AllFootball.yaml
