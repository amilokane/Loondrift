      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Netflix.png

  - select:
      name: Spotify
      policies: [Proxy, Smart, Manual, United States, Japan, Singapore, Taiwan, Hong Kong, Other Regions, DIRECT]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Spotify.png

  - select:
      name: Apple
      policies: [DIRECT, Proxy, Smart, Manual, United States, Japan, Singapore, Taiwan, Hong Kong, Other Regions]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Apple.png

  - select:
      name: Microsoft
      policies: [DIRECT, Proxy, Smart, Manual, United States, Japan, Singapore, Taiwan, Hong Kong, Other Regions]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Microsoft.png

  - select:
      name: PayPal
      policies: [Proxy, Smart, Manual, United States, Japan, Singapore, Taiwan, Hong Kong, Other Regions, DIRECT]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/PayPal.png

  - select:
      name: IP Location
      policies: [Proxy, Manual, Hong Kong, Japan, United States, Singapore, Taiwan, Other Regions, DIRECT]
      icon: mappin.circle.fill

  - select:
      name: AdBlock
      policies: [REJECT, DIRECT]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/AdBlock.png

  - select:
      name: Final
      policies: [Proxy, DIRECT]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Stack.png

  - fallback:
      name: Hong Kong
      policies: [Manual]
      flatten: true
      filter: '(?i)^(?!.*(?:剩余|到期|过期|有效期|套餐|官网|官方网站|重置|公告|流量\s*(?:[:：]|\d)|\b(?:traffic|remaining\s+(?:traffic|data)|expir(?:e|es|ed|y|ation)|reset)\b|https?://))(?=.*(?:🇭🇰|香港|(?<![A-Za-z])HKG?(?![A-Za-z])|(?<![A-Za-z])hong\s*kong(?![A-Za-z]))).+$'
      interval: 600
      timeout: 3
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/HongKong.png

  - fallback:
      name: Japan
      policies: [Manual]
      flatten: true
      filter: '(?i)^(?!.*(?:剩余|到期|过期|有效期|套餐|官网|官方网站|重置|公告|流量\s*(?:[:：]|\d)|\b(?:traffic|remaining\s+(?:traffic|data)|expir(?:e|es|ed|y|ation)|reset)\b|https?://))(?=.*(?:🇯🇵|日本|東京|东京|大阪|京都|(?<![A-Za-z])(?:JPN?|japan|tokyo|osaka|kyoto)(?![A-Za-z]))).+$'
      interval: 600
      timeout: 3
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Japan.png

  - fallback:
      name: United States
      policies: [Manual]
      flatten: true
      filter: '(?i)^(?!.*(?:剩余|到期|过期|有效期|套餐|官网|官方网站|重置|公告|流量\s*(?:[:：]|\d)|\b(?:traffic|remaining\s+(?:traffic|data)|expir(?:e|es|ed|y|ation)|reset)\b|https?://))(?=.*(?:🇺🇸|美国|美國|纽约|紐約|洛杉矶|洛杉磯|旧金山|舊金山|芝加哥|休斯顿|休斯頓|迈阿密|邁阿密|西雅图|西雅圖|波士顿|波士頓|华盛顿|華盛頓|拉斯维加斯|拉斯維加斯|圣何塞|聖何塞|圣地亚哥|聖地亞哥|(?<![A-Za-z])(?:USA?|united\s*states|los\s*angeles|new\s*york|san\s*francisco|chicago|houston|miami|seattle|boston|washington|las\s*vegas|san\s*jose|san\s*diego)(?![A-Za-z]))).+$'
      interval: 600
      timeout: 3
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/America.png

  - fallback:
      name: Singapore
      policies: [Manual]
      flatten: true
      filter: '(?i)^(?!.*(?:剩余|到期|过期|有效期|套餐|官网|官方网站|重置|公告|流量\s*(?:[:：]|\d)|\b(?:traffic|remaining\s+(?:traffic|data)|expir(?:e|es|ed|y|ation)|reset)\b|https?://))(?=.*(?:🇸🇬|新加坡|狮城|獅城|(?<![A-Za-z])SGP?(?![A-Za-z])|(?<![A-Za-z])singapore(?![A-Za-z]))).+$'
      interval: 600
      timeout: 3
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Singapore.png

  - fallback:
      name: Taiwan
      policies: [Manual]
      flatten: true
      filter: '(?i)^(?!.*(?:剩余|到期|过期|有效期|套餐|官网|官方网站|重置|公告|流量\s*(?:[:：]|\d)|\b(?:traffic|remaining\s+(?:traffic|data)|expir(?:e|es|ed|y|ation)|reset)\b|https?://))(?=.*(?:🇹🇼|台湾|台灣|台北|高雄|(?<![A-Za-z])TWN?(?![A-Za-z])|(?<![A-Za-z])taiwan(?![A-Za-z]))).+$'
      interval: 600
      timeout: 3
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Taiwan.png

  - select:
      name: Manual
      policies: [Airport]
      flatten: true
      filter: '(?i)^(?!.*(?:剩余|到期|过期|有效期|套餐|官网|官方网站|重置|公告|流量\s*(?:[:：]|\d)|\b(?:traffic|remaining\s+(?:traffic|data)|expir(?:e|es|ed|y|ation)|reset)\b|https?://)).+$'
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Static.png

  - select:
      name: Other Regions
      policies: [Manual]
      flatten: true
      filter: '(?i)^(?!.*(?:剩余|到期|过期|有效期|套餐|官网|官方网站|重置|公告|流量\s*(?:[:：]|\d)|\b(?:traffic|remaining\s+(?:traffic|data)|expir(?:e|es|ed|y|ation)|reset)\b|https?://))(?!.*(?:🇭🇰|香港|(?<![A-Za-z])HKG?(?![A-Za-z])|(?<![A-Za-z])hong\s*kong(?![A-Za-z])|🇯🇵|日本|東京|东京|大阪|京都|(?<![A-Za-z])(?:JPN?|japan|tokyo|osaka|kyoto)(?![A-Za-z])|🇺🇸|美国|美國|纽约|紐約|洛杉矶|洛杉磯|旧金山|舊金山|芝加哥|休斯顿|休斯頓|迈阿密|邁阿密|西雅图|西雅圖|波士顿|波士頓|华盛顿|華盛頓|拉斯维加斯|拉斯維加斯|圣何塞|聖何塞|圣地亚哥|聖地亞哥|(?<![A-Za-z])(?:USA?|united\s*states|los\s*angeles|new\s*york|san\s*francisco|chicago|houston|miami|seattle|boston|washington|las\s*vegas|san\s*jose|san\s*diego)(?![A-Za-z])|🇸🇬|新加坡|狮城|獅城|(?<![A-Za-z])SGP?(?![A-Za-z])|(?<![A-Za-z])singapore(?![A-Za-z])|🇹🇼|台湾|台灣|台北|高雄|(?<![A-Za-z])TWN?(?![A-Za-z])|(?<![A-Za-z])taiwan(?![A-Za-z]))).+$'
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/WorldMap.png

  - smart:
      name: Smart
      policies: [Manual]
      flatten: true
      filter: |-
        (?ix)^
        (?!.*(?:剩余|到期|过期|有效期|套餐|官网|官方网站|重置|公告|流量\s*(?:[:：]|\d)|\b(?:traffic|remaining\s+(?:traffic|data)|expir(?:e|es|ed|y|ation)|reset)\b|https?://))
        (?!.*高倍)
        (?!.*(?:
          # 后缀倍率，如 2x 01。编号与前缀倍率分开时，如 02 x0.5，留给下一分支。
          (?<![\d.])0*(?:1\.0*[1-9]\d*|(?:[2-9]\d*|1\d+)(?:\.\d+)?)
          (?!\s+(?:[*×✕✖⨯⨉x]|倍率)\s*\d)
          \s*(?:[*×✕✖⨯⨉]|(?<![A-Za-z])x(?![A-Za-z])|倍率(?!\s*[:：]\s*\d)|倍)(?![\d.率])
          |
          # 前缀倍率，如 x2、倍率：2。1x 02 中的 02 是编号。
          (?!(?<=\d)(?:[*×✕✖⨯⨉x]|倍率)\s+\d)
          (?:[*×✕✖⨯⨉]|(?<![A-Za-z])x(?![A-Za-z])|倍率\s*[:：]?)
          \s*0*(?:1\.0*[1-9]\d*|(?:[2-9]\d*|1\d+)(?:\.\d+)?)(?![\d.])
        )).+$
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Auto.png

rules:
  # 局域网与广告
  - domain_suffix:
      match: local
      policy: DIRECT
  - domain_suffix:
      match: lan
      policy: DIRECT
  - domain_suffix:
      match: home.arpa
      policy: DIRECT
  - rule_set:
      name: 私有网络
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Lan/Lan.yaml
      policy: DIRECT
      update_interval: 86400
  - rule_set:
      name: 广告拦截
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/AdvertisingLite/AdvertisingLite_All_No_Resolve.yaml
      policy: AdBlock
      update_interval: 86400

  # 服务分流
  - rule_set:
      name: Threads
      match: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/threads.list
      policy: Meta
      update_interval: 86400
  - rule_set:
      name: FCM
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/GoogleFCM/GoogleFCM.yaml
      policy: Google
      update_interval: 86400
  - rule_set:
      name: YouTube
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/YouTube/YouTube.yaml
      policy: YouTube
      update_interval: 86400
  - rule_set:
      name: TikTok
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/TikTok/TikTok.yaml
      policy: TikTok
      update_interval: 86400
  - rule_set:
      name: 国内AI
      match: https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/main/rules/egern/cn.yaml
      policy: DIRECT
      update_interval: 86400
  - rule_set:
      name: Google AI
      match: https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/main/rules/egern/google-ai.yaml
      policy: AI
      update_interval: 86400
  - rule_set:
      name: ChatGPT
      match: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/openai.list
      policy: AI
      update_interval: 86400
  - rule_set:
      name: Claude
      match: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/anthropic.list
      policy: AI
      update_interval: 86400
  - rule_set:
      name: Google
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Google/Google.yaml
      policy: Google
      update_interval: 86400
  - rule_set:
      name: GitHub
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/GitHub/GitHub.yaml
      policy: GitHub
      update_interval: 86400
  - rule_set:
      name: Apple
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Apple/Apple_All_No_Resolve.yaml
      policy: Apple
      update_interval: 86400
  - rule_set:
      name: Telegram
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Telegram/Telegram.yaml
      policy: Telegram
      update_interval: 86400
  - rule_set:
      name: Twitter
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Twitter/Twitter.yaml
      policy: Twitter
      update_interval: 86400
  - rule_set:
      name: Facebook
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Facebook/Facebook.yaml
      policy: Meta
      update_interval: 86400
  - rule_set:
      name: Netflix
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Netflix/Netflix.yaml
      policy: Netflix
      update_interval: 86400
  - rule_set:
      name: Spotify
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Spotify/Spotify.yaml
      policy: Spotify
      update_interval: 86400
  - rule_set:
      name: PayPal
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/PayPal/PayPal.yaml
      policy: PayPal
      update_interval: 86400
  - rule_set:
      name: Microsoft
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Microsoft/Microsoft.yaml
      policy: Microsoft
      update_interval: 86400

  # 国内、海外与兜底
  - rule_set:
      name: 国内综合
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/ChinaMax/ChinaMax_All_No_Resolve.yaml
      policy: DIRECT
      update_interval: 86400
  - rule_set:
      name: 非中国域名
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Global/Global_All_No_Resolve.yaml
      policy: Proxy
      update_interval: 86400

  - default:
      policy: Final

