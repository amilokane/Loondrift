      policies: [Manual]
      flatten: true
      filter: '(?i)^(?!.*(?:剩余|到期|过期|有效期|套餐|官网|官方网站|重置|公告|流量\s*(?:[:：]|\d)|\b(?:traffic|remaining\s+(?:traffic|data)|expir(?:e|es|ed|y|ation)|reset)\b|https?://))(?!.*(?:(?<![\d.])0*(?:1\.0*[1-9]\d*|(?:[2-9]\d*|1\d+)(?:\.\d+)?)\s*(?:(?:[*×✕✖⨯⨉]|(?<![A-Za-z])x(?![A-Za-z]))|倍率(?!\s*[:：]\s*\d)|倍)(?!\s*[\d.率])|(?:(?:[*×✕✖⨯⨉]|(?<![A-Za-z])x(?![A-Za-z]))|倍率\s*[:：]?)\s*0*(?:1\.0*[1-9]\d*|(?:[2-9]\d*|1\d+)(?:\.\d+)?)(?![\d.])))(?:(?=.*(?:(?<![\d.])0+(?:\.(?:[0-4]\d*|50*))?\s*(?:(?:[*×✕✖⨯⨉]|(?<![A-Za-z])x(?![A-Za-z]))|倍率(?!\s*[:：]\s*\d)|倍)(?!\s*[\d.率])|(?:(?:[*×✕✖⨯⨉]|(?<![A-Za-z])x(?![A-Za-z]))|倍率\s*[:：]?)\s*0+(?:\.(?:[0-4]\d*|50*))?(?![\d.])))|(?!.*(?:(?<![\d.])\d+(?:\.\d+)?\s*(?:(?:[*×✕✖⨯⨉]|(?<![A-Za-z])x(?![A-Za-z]))|倍率(?!\s*[:：]\s*\d)|倍)(?!\s*[\d.率])|(?:(?:[*×✕✖⨯⨉]|(?<![A-Za-z])x(?![A-Za-z]))|倍率\s*[:：]?)\s*\d+(?:\.\d+)?(?![\d.])))(?=.*(?:低倍|免费|(?<![A-Za-z])free(?![A-Za-z])|^(?!.*(?:客户端|软件)).*下载))).*$'
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Available.png

  - select:
      name: High Rate
      policies: [Manual]
      flatten: true
      filter: '(?i)^(?!.*(?:剩余|到期|过期|有效期|套餐|官网|官方网站|重置|公告|流量\s*(?:[:：]|\d)|\b(?:traffic|remaining\s+(?:traffic|data)|expir(?:e|es|ed|y|ation)|reset)\b|https?://))(?:(?=.*(?:(?<![\d.])0*(?:1\.0*[1-9]\d*|(?:[2-9]\d*|1\d+)(?:\.\d+)?)\s*(?:(?:[*×✕✖⨯⨉]|(?<![A-Za-z])x(?![A-Za-z]))|倍率(?!\s*[:：]\s*\d)|倍)(?!\s*[\d.率])|(?:(?:[*×✕✖⨯⨉]|(?<![A-Za-z])x(?![A-Za-z]))|倍率\s*[:：]?)\s*0*(?:1\.0*[1-9]\d*|(?:[2-9]\d*|1\d+)(?:\.\d+)?)(?![\d.])))|(?!.*(?:(?<![\d.])\d+(?:\.\d+)?\s*(?:(?:[*×✕✖⨯⨉]|(?<![A-Za-z])x(?![A-Za-z]))|倍率(?!\s*[:：]\s*\d)|倍)(?!\s*[\d.率])|(?:(?:[*×✕✖⨯⨉]|(?<![A-Za-z])x(?![A-Za-z]))|倍率\s*[:：]?)\s*\d+(?:\.\d+)?(?![\d.])))(?=.*高倍)).*$'
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Airport.png

  - select:
      name: Other Regions
      policies: [Manual]
      flatten: true
      filter: '(?i)^(?!.*(?:剩余|到期|过期|有效期|套餐|官网|官方网站|重置|公告|流量\s*(?:[:：]|\d)|\b(?:traffic|remaining\s+(?:traffic|data)|expir(?:e|es|ed|y|ation)|reset)\b|https?://))(?!.*(?:🇭🇰|香港|(?<![A-Za-z])HKG?(?![A-Za-z])|(?<![A-Za-z])hong\s*kong(?![A-Za-z])|🇯🇵|日本|東京|东京|大阪|京都|(?<![A-Za-z])(?:JPN?|japan|tokyo|osaka|kyoto)(?![A-Za-z])|🇺🇸|美国|美國|纽约|紐約|洛杉矶|洛杉磯|旧金山|舊金山|芝加哥|休斯顿|休斯頓|迈阿密|邁阿密|西雅图|西雅圖|波士顿|波士頓|华盛顿|華盛頓|拉斯维加斯|拉斯維加斯|圣何塞|聖何塞|圣地亚哥|聖地亞哥|(?<![A-Za-z])(?:USA?|united\s*states|los\s*angeles|new\s*york|san\s*francisco|chicago|houston|miami|seattle|boston|washington|las\s*vegas|san\s*jose|san\s*diego)(?![A-Za-z])|🇸🇬|新加坡|狮城|獅城|(?<![A-Za-z])SGP?(?![A-Za-z])|(?<![A-Za-z])singapore(?![A-Za-z])|🇹🇼|台湾|台灣|台北|高雄|(?<![A-Za-z])TWN?(?![A-Za-z])|(?<![A-Za-z])taiwan(?![A-Za-z]))).+$'
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/WorldMap.png

  - smart:
      name: Smart
      policies: [Manual]
      flatten: true
      filter: '(?i)^(?!.*(?:剩余|到期|过期|有效期|套餐|官网|官方网站|重置|公告|流量\s*(?:[:：]|\d)|\b(?:traffic|remaining\s+(?:traffic|data)|expir(?:e|es|ed|y|ation)|reset)\b|https?://))(?!.*高倍)(?!.*(?:(?<![\d.])0*(?:1\.0*[1-9]\d*|(?:[2-9]\d*|1\d+)(?:\.\d+)?)\s*(?:(?:[*×✕✖⨯⨉]|(?<![A-Za-z])x(?![A-Za-z]))|倍率(?!\s*[:：]\s*\d)|倍)(?!\s*[\d.率])|(?:(?:[*×✕✖⨯⨉]|(?<![A-Za-z])x(?![A-Za-z]))|倍率\s*[:：]?)\s*0*(?:1\.0*[1-9]\d*|(?:[2-9]\d*|1\d+)(?:\.\d+)?)(?![\d.]))).+$'
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Auto.png

rules:
  # 全局 STUN 拦截及本地优先规则。
  - protocol:
      match: stun
      policy: REJECT
  - domain:
      match: dns.weixin.qq.com.cn
      policy: DIRECT
  - domain_suffix:
      match: weixin.qq.com
      policy: DIRECT
  - domain_suffix:
      match: weixin.com
      policy: DIRECT
  - domain_suffix:
      match: wechat.com
      policy: DIRECT
  - domain_suffix:
      match: wx.qq.com
      policy: DIRECT
  - domain_suffix:
      match: wx.gtimg.com
      policy: DIRECT
  - domain_suffix:
      match: servicewechat.com
      policy: DIRECT
  - domain_suffix:
      match: weixinbridge.com
      policy: DIRECT
  - domain_suffix:
      match: wechatpay.com
      policy: DIRECT
  - domain_suffix:
      match: tenpay.com
      policy: DIRECT
  - domain_suffix:
      match: wxs.qq.com
      policy: DIRECT
  - domain_suffix:
      match: wxapp.tc.qq.com
      policy: DIRECT
  - domain_suffix:
      match: qpic.cn
      policy: DIRECT
  - domain_suffix:
      match: qlogo.cn
      policy: DIRECT
  - domain_suffix:
      match: fsend.cn
      policy: DIRECT
  - domain:
      match: international-gfe.download.nvidia.com
      policy: DIRECT
  - domain:
      match: trae-api-sg.mchost.guru
      policy: AI
  - domain:
      match: trae-api-us.mchost.guru
      policy: AI
  - domain_suffix:
      match: trae.ai
      policy: AI
  - domain_suffix:
      match: stripe.network
      policy: AI
  - domain_suffix:
      match: stripecdn.com
      policy: AI
  - domain:
      match: dns.alidns.com
      policy: DIRECT
  - domain:
      match: doh.pub
      policy: DIRECT

  # 远程规则按 Loon 版的优先级顺序排列。
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Lan/Lan.yaml
      policy: DIRECT
      name: 私有网络
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/AdvertisingLite/AdvertisingLite.yaml
      policy: AdBlock
      name: 广告拦截
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/AdvertisingLite/AdvertisingLite_Domain.yaml
      policy: AdBlock
      name: 广告域名
      update_interval: 86400
  - domain_suffix:
      match: threads.com
      policy: Meta
      name: Threads
  - domain_suffix:
      match: threads.net
      policy: Meta
      name: Threads
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/GoogleFCM/GoogleFCM.yaml
      policy: Google
      name: FCM
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/YouTube/YouTube.yaml
      policy: YouTube
      name: YouTube
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/TikTok/TikTok.yaml
      policy: TikTok
      name: TikTok
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/main/rules/egern/cn.yaml
      policy: DIRECT
      name: 国内AI
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/main/rules/egern/global.yaml
      policy: AI
      name: 海外AI
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Google/Google.yaml
      policy: Google
      name: Google
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/GitHub/GitHub.yaml
      policy: GitHub
      name: GitHub
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Apple/Apple.yaml
      policy: Apple
      name: Apple
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Apple/Apple_Domain.yaml
      policy: Apple
      name: Apple域名
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Telegram/Telegram.yaml
      policy: Telegram
      name: Telegram
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Twitter/Twitter.yaml
      policy: Twitter
      name: Twitter
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Facebook/Facebook.yaml
      policy: Meta
      name: Facebook
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Netflix/Netflix.yaml
      policy: Netflix
      name: Netflix
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Spotify/Spotify.yaml
      policy: Spotify
      name: Spotify
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/PayPal/PayPal.yaml
      policy: PayPal
      name: PayPal
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Microsoft/Microsoft.yaml
      policy: Microsoft
      name: Microsoft
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/ChinaMax/ChinaMax.yaml
      policy: DIRECT
      name: 国内综合
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/ChinaMax/ChinaMax_Domain.yaml
      policy: DIRECT
      name: 国内域名
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Global/Global.yaml
      policy: Proxy
      name: 非中国域名
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Global/Global_Domain.yaml
      policy: Proxy
      name: 非中国域名分表
      update_interval: 86400

  - default:
      policy: Final
