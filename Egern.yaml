# Loondrift for Egern · 2.3 · amilokane
# 版本规则：每次更新小数位加 1，满 10 进位（2.9 之后是 3.0）。
# 在 Egern 内将自己的订阅添加到「Airport」。

ipv6: false
allow_external_connections: false
vif_only: true
block_quic: true
close_connections_on_policy_change: true
hide_vpn_icon: false
geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
asn_db_url: https://github.com/P3TERX/GeoLite.mmdb/releases/latest/download/GeoLite2-ASN.mmdb
proxy_latency_test_url: https://cp.cloudflare.com/generate_204
direct_latency_test_url: http://www.qq.com
compat_route: false
include_all_networks: true
include_apns: false
real_ip_domains:
  - '*'
hijack_dns:
  - '*'
dns:
  # 下列 DoH 均使用 IP 地址，正常连接这些上游无需引导查询。
  bootstrap:
    - 1.1.1.1
    - 8.8.8.8
  upstreams:
    PUBLIC-DOH:
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    CN-DOH:
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
  forward:
    # 在选出可用代理之前，也能用当前网络的 DNS 解析测速域名。
    - domain:
        match: cp.cloudflare.com
        value: system
    - domain_suffix:
        match: local
        value: system
    - domain_suffix:
        match: lan
        value: system
    - domain_suffix:
        match: localdomain
        value: system
    - domain_suffix:
        match: home.arpa
        value: system
    # 默认走代理的服务先命中海外 DoH，避免其中个别域名被下面的国内集合抢先匹配。顺序与分流规则一致。
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/YouTube/YouTube.yaml
        value: PUBLIC-DOH
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/TikTok/TikTok.yaml
        value: PUBLIC-DOH
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/openai.list
        value: PUBLIC-DOH
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Google/Google.yaml
        value: PUBLIC-DOH
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/GitHub/GitHub.yaml
        value: PUBLIC-DOH
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Facebook/Facebook.yaml
        value: PUBLIC-DOH
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Netflix/Netflix.yaml
        value: PUBLIC-DOH
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Spotify/Spotify.yaml
        value: PUBLIC-DOH
    # 国内域名（分流规则「国内综合」的域名部分）和默认直连的 Apple、Microsoft、PayPal 交给国内 DoH。
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/ChinaMax/ChinaMax_Domain.yaml
        value: CN-DOH
    - domain_suffix:
        match: cn
        value: CN-DOH
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Apple/Apple_Domain.yaml
        value: CN-DOH
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Microsoft/Microsoft.yaml
        value: CN-DOH
    - proxy_rule_set:
        match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/PayPal/PayPal.yaml
        value: CN-DOH
    - domain_wildcard:
        match: '*'
        value: PUBLIC-DOH
  proxy_nameservers:
    # 建立代理连接时直连加密 DNS，保留多个可用入口。
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

default_subscription_group: Airport
default_proxy_group: Manual

policy_groups:
  - external:
      name: Airport
      type: select
      hidden: true
      urls: []
      update_interval: 86400
      # 流量、到期、官网等提示条目在这里统一排除，后面的分组只写各自的匹配条件。
      filter: |-
        (?ix)^
        (?!.*(?:
            剩余 | 到期 | 过期 | 有效期 | 重置
          | 套餐 | 订阅 | 续费 | 公告
          | 官网 | 官方网站 | https?://
          | 流量 \s* (?: [:：] | \d (?! [\d.]* \s* (?: 倍 | [x*×✕✖⨯⨉] ) ) )
          | \b (?: traffic | remaining\s+(?:traffic|data) | expir(?:e|es|ed|y|ation) | reset ) \b
        ))
        .+$
      icon: tray.and.arrow.down

  - select:
      name: Proxy
      policies: [Smart, Hong Kong, Japan, United States, Singapore, Taiwan, Other Regions, Manual]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Proxy.png

  - select:
      name: AI
      policies: [Proxy, Smart, Hong Kong, Japan, United States, Singapore, Taiwan, Other Regions, Manual, DIRECT]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/OpenAI.png

  - select:
      name: Google
      policies: [Proxy, Smart, Hong Kong, Japan, United States, Singapore, Taiwan, Other Regions, Manual, DIRECT]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Google.png

  - select:
      name: YouTube
      policies: [Proxy, Smart, Hong Kong, Japan, United States, Singapore, Taiwan, Other Regions, Manual, DIRECT]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/YouTube.png

  - select:
      name: GitHub
      policies: [Proxy, Smart, Hong Kong, Japan, United States, Singapore, Taiwan, Other Regions, Manual, DIRECT]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/GitHub.png

  - select:
      name: Telegram
      policies: [Proxy, Smart, Hong Kong, Japan, United States, Singapore, Taiwan, Other Regions, Manual, DIRECT]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Telegram.png

  - select:
      name: Meta
      policies: [Proxy, Smart, Hong Kong, Japan, United States, Singapore, Taiwan, Other Regions, Manual, DIRECT]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Meta.png

  - select:
      name: Twitter
      policies: [Proxy, Smart, Hong Kong, Japan, United States, Singapore, Taiwan, Other Regions, Manual, DIRECT]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Twitter.png

  - select:
      name: TikTok
      policies: [Japan, Proxy, Smart, Hong Kong, United States, Singapore, Taiwan, Other Regions, Manual, DIRECT]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/TikTok.png

  - select:
      name: Netflix
      policies: [Proxy, Smart, Hong Kong, Japan, United States, Singapore, Taiwan, Other Regions, Manual, DIRECT]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Netflix.png

  - select:
      name: Spotify
      policies: [Proxy, Smart, Hong Kong, Japan, United States, Singapore, Taiwan, Other Regions, Manual, DIRECT]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Spotify.png

  - select:
      name: Apple
      policies: [DIRECT, Proxy, Smart, Hong Kong, Japan, United States, Singapore, Taiwan, Other Regions, Manual]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Apple.png

  - select:
      name: Microsoft
      policies: [DIRECT, Proxy, Smart, Hong Kong, Japan, United States, Singapore, Taiwan, Other Regions, Manual]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Microsoft.png

  - select:
      name: PayPal
      policies: [DIRECT, Proxy, Smart, Hong Kong, Japan, United States, Singapore, Taiwan, Other Regions, Manual]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/PayPal.png

  - select:
      name: IP Location
      policies: [Proxy, Hong Kong, Japan, United States, Singapore, Taiwan, Other Regions, Manual, DIRECT]
      icon: mappin.circle.fill

  - select:
      name: AdBlock
      policies: [REJECT, DIRECT]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/AdBlock.png

  - select:
      name: Final
      policies: [Proxy, DIRECT]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Stack.png

  # 低于 1 倍的节点优先，未标倍率的其次，标有 1 倍及以上或「高倍」的排最后。
  # 系数乘在节点评分上，越小越优先；先判断高倍率，再判断低倍率，未命中的按 1 计。
  # 独立的 0.5 兼容旧命名，v0.8 等版本号忽略。名称带「直连」的节点不参与自动选择。
  - smart:
      name: Smart
      policies: [Manual]
      flatten: true
      filter: '(?i)^(?!.*(?:直连|DIRECT)).+$'
      priorities:
        '(?i)高倍|(?<![a-z\d.])(?:[x*×✕✖⨯⨉]|倍率\s*[:：]?)\s*0*[1-9]\d*(?:\.\d+)?(?![a-z\d.])|(?<![\d.])0*[1-9]\d*(?:\.\d+)?(?!\s+(?:[x*×✕✖⨯⨉]|倍率)\s*[:：]?\s*\d)\s*(?:[x*×✕✖⨯⨉]|倍率(?!\s*[:：])|倍(?!率))(?![a-z\d.])': 10
        '(?i)(?<![a-z\d.])x?0\.\d*[1-9]\d*(?![a-z\d.])|(?<![\d.])0\.\d*[1-9]\d*\s*(?:[x*×✕✖⨯⨉]|倍率|倍)(?![a-z\d.])': 0.1
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Auto.png

  - auto_test:
      name: Hong Kong
      policies: [Manual]
      flatten: true
      filter: |-
        (?ix)
          🇭🇰 | 香港 | [沪深广京杭莞苏粤]港
        | (?<![a-z]) (?: HKG? | hong\s*kong ) (?![a-z])
      interval: 600
      timeout: 5
      tolerance: 50
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/HongKong.png

  - auto_test:
      name: Japan
      policies: [Manual]
      flatten: true
      filter: |-
        (?ix)
          🇯🇵 | 日本 | 東京 | 东京 | 大阪 | 京都 | [沪深广京杭莞苏粤]日
        | (?<![a-z]) (?:
              JPN? | japan | tokyo | osaka | kyoto
            | NRT | HND | KIX | FUK | NGO | OSA | CTS | SDJ | OKA
          ) (?![a-z])
      interval: 600
      timeout: 5
      tolerance: 50
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Japan.png

  - auto_test:
      name: United States
      policies: [Manual]
      flatten: true
      filter: |-
        (?ix)
          🇺🇸 | 美国 | 美國 | 美西 | 美东 | 美東 | [沪深广京杭莞苏粤]美
        | 纽约 | 紐約 | 洛杉矶 | 洛杉磯 | 旧金山 | 舊金山 | 芝加哥 | 休斯顿 | 休斯頓
        | 迈阿密 | 邁阿密 | 西雅图 | 西雅圖 | 波士顿 | 波士頓 | 华盛顿 | 華盛頓
        | 拉斯维加斯 | 拉斯維加斯 | 圣何塞 | 聖何塞 | 圣地亚哥 | 聖地亞哥
        | (?<![a-z]) (?:
              USA? | united\s*states
            | los\s*angeles | new\s*york | san\s*francisco | chicago | houston | miami
            | seattle | boston | washington | las\s*vegas | san\s*jose | san\s*diego | denver
            | LAX | SJC | SFO | ORD | JFK | DFW | IAD | PHX | ATL | BOS | MIA | EWR
            | LGA | IAH | HOU | OAK | SNA | PDX | DAL | SLC | MSP
          ) (?![a-z])
      interval: 600
      timeout: 5
      tolerance: 50
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/America.png

  - auto_test:
      name: Singapore
      policies: [Manual]
      flatten: true
      filter: |-
        (?ix)
          🇸🇬 | 新加坡 | 狮城 | 獅城 | [沪深广京杭莞苏粤]新
        | (?<![a-z]) (?: SGP? | SIN | singapore ) (?![a-z])
      interval: 600
      timeout: 5
      tolerance: 50
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Singapore.png

  - auto_test:
      name: Taiwan
      policies: [Manual]
      flatten: true
      filter: |-
        (?ix)
          🇹🇼 | 台湾 | 台灣 | 臺灣 | 台北 | 臺北 | 高雄 | [沪深广京杭莞苏粤]台
        | (?<![a-z]) (?: TWN? | TPE | taiwan ) (?![a-z])
      interval: 600
      timeout: 5
      tolerance: 50
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Taiwan.png

  - select:
      name: Other Regions
      policies: [Manual]
      flatten: true
      filter: |-
        (?ix)^
        (?!.*(?:
            🇭🇰 | 香港 | [沪深广京杭莞苏粤][港日美新台]
          | 🇯🇵 | 日本 | 東京 | 东京 | 大阪 | 京都
          | 🇺🇸 | 美国 | 美國 | 美西 | 美东 | 美東
          | 纽约 | 紐約 | 洛杉矶 | 洛杉磯 | 旧金山 | 舊金山 | 芝加哥 | 休斯顿 | 休斯頓
          | 迈阿密 | 邁阿密 | 西雅图 | 西雅圖 | 波士顿 | 波士頓 | 华盛顿 | 華盛頓
          | 拉斯维加斯 | 拉斯維加斯 | 圣何塞 | 聖何塞 | 圣地亚哥 | 聖地亞哥
          | 🇸🇬 | 新加坡 | 狮城 | 獅城
          | 🇹🇼 | 台湾 | 台灣 | 臺灣 | 台北 | 臺北 | 高雄
          | (?<![a-z]) (?:
                HKG? | hong\s*kong
              | JPN? | japan | tokyo | osaka | kyoto
              | NRT | HND | KIX | FUK | NGO | OSA | CTS | SDJ | OKA
              | USA? | united\s*states
              | los\s*angeles | new\s*york | san\s*francisco | chicago | houston | miami
              | seattle | boston | washington | las\s*vegas | san\s*jose | san\s*diego | denver
              | LAX | SJC | SFO | ORD | JFK | DFW | IAD | PHX | ATL | BOS | MIA | EWR
              | LGA | IAH | HOU | OAK | SNA | PDX | DAL | SLC | MSP
              | SGP? | SIN | singapore
              | TWN? | TPE | taiwan
            ) (?![a-z])
        ))
        .+$
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/WorldMap.png

  - select:
      name: Manual
      policies: [Airport]
      flatten: true
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Static.png

rules:
  # DNS 上游：海外 DoH 走代理，国内 DoH 直连。
  - ip_cidr:
      match: 1.1.1.1/32
      policy: Proxy
      no_resolve: true
  - ip_cidr:
      match: 8.8.8.8/32
      policy: Proxy
      no_resolve: true
  - ip_cidr:
      match: 223.5.5.5/32
      policy: DIRECT
      no_resolve: true
  - ip_cidr:
      match: 1.12.12.12/32
      policy: DIRECT
      no_resolve: true
  # 局域网与广告
  - domain_suffix:
      match: local
      policy: DIRECT
  - domain_suffix:
      match: lan
      policy: DIRECT
  - domain_suffix:
      match: home.arpa
      policy: DIRECT
  - rule_set:
      name: 私有网络
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Lan/Lan.yaml
      policy: DIRECT
      update_interval: 86400
  - rule_set:
      name: 广告拦截
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/AdvertisingLite/AdvertisingLite_All_No_Resolve.yaml
      policy: AdBlock
      update_interval: 86400
  - rule_set:
      name: 广告拦截补充
      match: https://raw.githubusercontent.com/RiverFlowsInUUU/RFU-Rules/main/surge-ads.list
      policy: AdBlock
      update_interval: 86400

  # 服务分流
  - rule_set:
      name: Threads
      match: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/threads.list
      policy: Meta
      update_interval: 86400
  - rule_set:
      name: FCM
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/GoogleFCM/GoogleFCM.yaml
      policy: Google
      update_interval: 86400
  - rule_set:
      name: YouTube
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/YouTube/YouTube.yaml
      policy: YouTube
      update_interval: 86400
  - rule_set:
      name: TikTok
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/TikTok/TikTok.yaml
      policy: TikTok
      update_interval: 86400
  - rule_set:
      name: 国内AI
      match: https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/main/rules/egern/cn.yaml
      policy: DIRECT
      update_interval: 86400
  - rule_set:
      name: Google AI
      match: https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/main/rules/egern/google-ai.yaml
      policy: AI
      update_interval: 86400
  - rule_set:
      name: ChatGPT
      match: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/openai.list
      policy: AI
      update_interval: 86400
  - rule_set:
      name: Claude
      match: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/anthropic.list
      policy: AI
      update_interval: 86400
  - rule_set:
      name: Perplexity
      match: https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/main/rules/egern/perplexity.yaml
      policy: AI
      update_interval: 86400
  - rule_set:
      name: Grok
      match: https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/main/rules/egern/x-ai.yaml
      policy: AI
      update_interval: 86400
  - rule_set:
      name: Cursor
      match: https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/main/rules/egern/cursor.yaml
      policy: AI
      update_interval: 86400
  - rule_set:
      name: Google
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Google/Google.yaml
      policy: Google
      update_interval: 86400
  - rule_set:
      name: GitHub
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/GitHub/GitHub.yaml
      policy: GitHub
      update_interval: 86400
  - rule_set:
      name: Apple
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Apple/Apple_All_No_Resolve.yaml
      policy: Apple
      update_interval: 86400
  - rule_set:
      name: Telegram
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Telegram/Telegram.yaml
      policy: Telegram
      update_interval: 86400
  - rule_set:
      name: Twitter
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Twitter/Twitter.yaml
      policy: Twitter
      update_interval: 86400
  - rule_set:
      name: Facebook
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Facebook/Facebook.yaml
      policy: Meta
      update_interval: 86400
  - rule_set:
      name: Netflix
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Netflix/Netflix.yaml
      policy: Netflix
      update_interval: 86400
  - rule_set:
      name: Spotify
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Spotify/Spotify.yaml
      policy: Spotify
      update_interval: 86400
  - rule_set:
      name: PayPal
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/PayPal/PayPal.yaml
      policy: PayPal
      update_interval: 86400
  - rule_set:
      name: Microsoft
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Microsoft/Microsoft.yaml
      policy: Microsoft
      update_interval: 86400

  # 国内、海外与兜底
  - rule_set:
      name: 国内综合
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/ChinaMax/ChinaMax_All_No_Resolve.yaml
      policy: DIRECT
      update_interval: 86400
  - rule_set:
      name: 非中国域名
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Global/Global_All_No_Resolve.yaml
      policy: Proxy
      update_interval: 86400
  # 规则集未收录、但 IP 位于中国大陆的目标直连。
  - geoip:
      match: CN
      policy: DIRECT

  - default:
      policy: Final

modules:
  - name: 广告平台拦截器
    url: https://kelee.one/Tool/Loon/Lpx/BlockAdvertisers.lpx
    enabled: true
  - name: HTTPDNS拦截器
    url: https://kelee.one/Tool/Loon/Lpx/Block_HTTPDNS.lpx
    enabled: true
  - name: 可莉广告过滤器
    url: https://kelee.one/Tool/Loon/Lpx/Remove_ads_by_keli.lpx
    enabled: true
  - name: Apple天气增强
