# Loondrift for Egern · 1.0.12
# 在 Egern 内将自己的订阅添加到「Airport」。

ipv6: true
allow_external_connections: true
vif_only: true
block_quic: true
close_connections_on_policy_change: true
hide_vpn_icon: false
geoip_db_url: https://git.io/GeoLite2-City.mmdb
asn_db_url: https://git.io/GeoLite2-ASN.mmdb
proxy_latency_test_url: http://connectivitycheck.gstatic.com/generate_204
direct_latency_test_url: http://www.qq.com
udp_latency_test_url: google.com@8.8.8.8
compat_route: true
include_all_networks: false
include_apns: false
dns:
  upstreams:
    DIRECT-DNS:
    - 180.76.76.76
    - 2400:da00::6666
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
    PROXY-DNS:
    - https://1.1.1.1/dns-query
    - https://1.12.12.12/dns-query
    - https://223.5.5.5/dns-query
    iBL3ND-DNS:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  forward:
  - proxy_rule_set:
      match: https://yfamilys.com/rule/TikTok.list
      value: iBL3ND-DNS
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/IBL3ND/rule/refs/heads/main/Gemini.list
      value: iBL3ND-DNS
      disabled: false
  - proxy_rule_set:
      match: https://yfamilys.com/rule/MetaAI.list
      value: iBL3ND-DNS
      disabled: false
  - proxy_rule_set:
      match: https://yfamilys.com/rule/Gemini.list
      value: iBL3ND-DNS
      disabled: false
  - proxy_rule_set:
      match: https://www.naiixi.com/Extra_Crypto.list
      value: iBL3ND-DNS
      disabled: false
  - proxy_rule_set:
      match: https://yfamilys.com/rule/OpenAI.list
      value: iBL3ND-DNS
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/rule/openai.list
      value: iBL3ND-DNS
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/OpenAI/OpenAI.list
      value: iBL3ND-DNS
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Crypto/Crypto.list
      value: iBL3ND-DNS
      disabled: false
  - proxy_rule_set:
      match: https://yfamilys.com/rule/Binance.list
      value: iBL3ND-DNS
      disabled: false
  - proxy_rule_set:
      match: https://yfamilys.com/rule/Twitter.list
      value: iBL3ND-DNS
      disabled: false
  - proxy_rule_set:
      match: https://yfamilys.com/rule/Telegram.list
      value: iBL3ND-DNS
      disabled: false
  - proxy_rule_set:
      match: https://yfamilys.com/rule/YouTube.list
      value: iBL3ND-DNS
      disabled: false
  - proxy_rule_set:
      match: https://yfamilys.com/rule/Instagram.list
      value: iBL3ND-DNS
      disabled: false
  - proxy_rule_set:
      match: https://yfamilys.com/rule/Cloudflare.list
      value: iBL3ND-DNS
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/GMOogway/shadowrocket-rules/master/sr_proxy_list.module
      value: iBL3ND-DNS
      disabled: false
  - proxy_rule_set:
      match: https://yfamilys.com/rule/ProxyMedia.list
      value: iBL3ND-DNS
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/egern/proxy.yaml
      value: iBL3ND-DNS
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/Rabbit-Spec/Surge/refs/heads/Master/Rules/China.list
      value: DIRECT-DNS
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/direct.txt
      value: DIRECT-DNS
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/GMOogway/shadowrocket-rules/master/sr_direct_list.module
      value: DIRECT-DNS
      disabled: false
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/egern/cn.yaml
      value: DIRECT-DNS
      disabled: false
  - proxy_rule_set:
      match: https://yfamilys.com/rule/DouYin.list
      value: DIRECT-DNS
      disabled: false
  - domain_wildcard:
      match: '*'
      value: iBL3ND-DNS
      disabled: false
  proxy_nameservers:
  - PROXY-DNS

default_subscription_group: Airport
default_proxy_group: Manual

policy_groups:
  - external:
      name: Airport
      type: select
      urls: []
      update_interval: 86400
      icon: tray.and.arrow.down

  - select:
      name: Proxy
      policies: [Smart, Hong Kong, Japan, United States, Singapore, Taiwan, Manual, Other Regions]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Proxy.png

  - select:
      name: AI
      policies: [United States, Proxy, Smart, Manual, Japan, Singapore, Taiwan, Hong Kong, Other Regions, DIRECT]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/OpenAI.png

  - select:
      name: Google
      policies: [Proxy, Smart, Manual, United States, Japan, Singapore, Taiwan, Hong Kong, Other Regions, DIRECT]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/Google.png

  - select:
      name: YouTube
      policies: [Proxy, Smart, Manual, United States, Japan, Singapore, Taiwan, Hong Kong, Other Regions, DIRECT]
      icon: https://raw.githubusercontent.com/AIsouler/MyClash/main/Icons/png/YouTube.png

  - select:
